services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: ahp-postgres
    environment:
      POSTGRES_DB: ahp_db
      POSTGRES_USER: ahp_user
      POSTGRES_PASSWORD: ahp_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahp_user -d ahp_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - ahp-network

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ahp-backend
    environment:
      DATABASE_URL: postgresql://ahp_user:ahp_password@postgres:5432/ahp_db
      JWT_SECRET: ${JWT_SECRET:-your-super-secret-jwt-key-change-in-production}
      NODE_ENV: production
      PORT: 3001
      FRONTEND_URL: http://localhost:3000
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:3001/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s
    networks:
      - ahp-network
    restart: unless-stopped

  # Frontend (React App)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3001/api
    container_name: ahp-frontend
    environment:
      VITE_API_URL: http://localhost:3001/api
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ahp-network
    restart: unless-stopped

volumes:
  postgres_data:
    driver: local

networks:
  ahp-network:
    driver: bridge
