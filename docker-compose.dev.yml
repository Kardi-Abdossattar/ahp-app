version: '3.8'

services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ahp_user
      POSTGRES_PASSWORD: ahp_password
      POSTGRES_DB: ahp_db
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ahp_user -d ahp_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      - DATABASE_URL=postgresql://ahp_user:ahp_password@postgres:5432/ahp_db
      - JWT_SECRET=please-change-me-to-a-strong-secret
      - NODE_ENV=development
      - PORT=3001
      - FRONTEND_URL=http://localhost:5173
    command: npm run dev
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - VITE_API_URL=http://localhost:3001/api
    command: npm run dev -- --host 0.0.0.0 --port 5173
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data_dev:
